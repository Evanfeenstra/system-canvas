name: Release

on:
  push:
    branches: [main]

# Only one release at a time; if a second push lands mid-publish, it queues.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip if the commit was made by the release bot itself (avoids infinite loop).
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      id-token: write   # required for npm OIDC trusted publishing
      contents: write   # required to push the version-bump commit back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Use a PAT or the default GITHUB_TOKEN; default works for same-repo pushes.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 22 ships with npm 10.x; we need >= 11.5.1 for OIDC trusted
          # publishing. We upgrade via a sudo install to a separate global
          # prefix below (in-place `npm install -g npm@latest` corrupts itself
          # by deleting its own files mid-execution on hosted runners).
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm to >= 11.5.1 (required for OIDC trusted publishing)
        run: |
          sudo npm install -g npm@latest --force
          npm --version

      - name: Strip auth-token line from .npmrc so npm uses OIDC
        # actions/setup-node writes "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}"
        # into ~/.npmrc. With an empty/missing NODE_AUTH_TOKEN, npm sees a malformed
        # token and either errors with ENEEDAUTH or sends bad auth instead of falling
        # back to OIDC. Removing the line entirely lets npm 11.5+ auto-discover the
        # GitHub Actions OIDC environment and exchange for a publish token.
        run: |
          if [ -f "$HOME/.npmrc" ]; then
            echo "Before:"
            cat "$HOME/.npmrc"
            sed -i '/_authToken/d' "$HOME/.npmrc"
            echo "After:"
            cat "$HOME/.npmrc"
          fi

      - name: Verify OIDC environment is available
        run: |
          if [ -z "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "::error::ACTIONS_ID_TOKEN_REQUEST_URL is not set. The job is missing 'id-token: write' permission or the runner doesn't support OIDC."
            exit 1
          fi
          echo "OIDC environment available."

      - name: Verify package versions are in lockstep with root
        run: |
          ROOT_VERSION=$(node -p "require('./package.json').version")
          echo "Root version: $ROOT_VERSION"
          FAIL=0
          for pkg in packages/core packages/react packages/standalone; do
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if [ "$PKG_VERSION" != "$ROOT_VERSION" ]; then
              echo "::error file=$pkg/package.json::$pkg version ($PKG_VERSION) does not match root version ($ROOT_VERSION). Per-package version edits are not supported. See AGENTS.md > Versioning & releases."
              FAIL=1
            fi
          done
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release version
        id: version
        run: |
          # If this push changed the root package.json's version field (vs. the
          # previous commit on main), honor it as an explicit release bump and
          # skip the auto-patch. Otherwise auto-patch as usual.
          ROOT_VERSION=$(node -p "require('./package.json').version")
          PREV_VERSION=$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "$ROOT_VERSION")
          if [ "$ROOT_VERSION" != "$PREV_VERSION" ]; then
            echo "Root version changed from $PREV_VERSION to $ROOT_VERSION in this commit — honoring as explicit release."
            echo "MODE=explicit" >> $GITHUB_OUTPUT
            echo "NEW_VERSION=$ROOT_VERSION" >> $GITHUB_OUTPUT
          else
            echo "No explicit version change detected; auto-patching."
            echo "MODE=auto-patch" >> $GITHUB_OUTPUT
          fi

      - name: Bump patch version (auto-patch mode only)
        if: steps.version.outputs.MODE == 'auto-patch'
        run: npm version patch --no-git-tag-version

      - name: Sync workspaces to root version
        run: |
          npm run sync-versions
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          # Only commit if there are changes (an explicit-mode release where the
          # author already pre-synced workspaces will have a clean tree here).
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "release: v$NEW_VERSION [skip ci]"
          fi
          git tag "v$NEW_VERSION"

      - name: Build all packages
        run: npm run build

      # No NODE_AUTH_TOKEN needed — the prior step stripped the _authToken line
      # from .npmrc, so npm 11.5+ falls through to OIDC trusted publishing using
      # the ACTIONS_ID_TOKEN_REQUEST_URL/ACTIONS_ID_TOKEN_REQUEST_TOKEN env vars
      # that GitHub injects when `id-token: write` is granted.
      - name: Publish system-canvas
        run: npm publish --provenance --access public -w system-canvas

      - name: Publish system-canvas-react
        run: npm publish --provenance --access public -w system-canvas-react

      - name: Publish system-canvas-standalone
        run: npm publish --provenance --access public -w system-canvas-standalone

      - name: Push version bump + tag
        run: git push --follow-tags origin main
